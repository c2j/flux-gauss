[package]
name = "fluxgauss"
version = "0.6.12"
edition = "2021"
description = "PL/pgSQL → Spring Boot/MyBatis Java converter"

[dependencies]
ogsql-parser = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
rayon = "1.10"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
chrono = "0.4"
regex = "1"
indexmap = "2"
encoding_rs = "0.8"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "parse_benchmark"
path = "benches/parse_benchmark.rs"
harness = false
