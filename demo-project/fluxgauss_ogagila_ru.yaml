# ogagila migration — Rust engine
# Prepared sources: lib/ogagila/sqls (psql \set meta-commands stripped)
output_dir: ./dest_ogagila_ru
base_package: com.ogagila

integration_test:
  enabled: true
  mode: remote
  url: jdbc:postgresql://localhost:5432/pagila
  username: gaussdb
  password: ${DB_PASSWORD}

