name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── ogsql binary (Linux only, for test jobs) ───────────────────
  build-ogsql-linux:
    name: Build ogsql (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ogsql-parser
        uses: actions/checkout@v4
        with:
          repository: c2j/ogsql-parser
          ref: main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: "0.13.0"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Build
        run: cargo zigbuild --release --features full --target x86_64-unknown-linux-gnu.2.17

      - name: Strip
        run: strip --strip-unneeded target/x86_64-unknown-linux-gnu/release/ogsql

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ogsql-linux
          retention-days: 1
          path: target/x86_64-unknown-linux-gnu/release/ogsql

  # ── Rust tests ─────────────────────────────────────────────────
  test-rust:
    name: Rust tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout flux-gauss
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Run Rust regression tests
        run: cargo test --test regress

  # ── Python tests ───────────────────────────────────────────────
  test-python:
    name: Python tests
    runs-on: ubuntu-22.04
    needs: [build-ogsql-linux]
    steps:
      - name: Checkout flux-gauss
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml pytest

      - name: Download ogsql
        uses: actions/download-artifact@v4
        with:
          name: ogsql-linux
          path: ogsql-artifact

      - name: Prepare ogsql
        run: |
          chmod +x ogsql-artifact/ogsql
          echo "OGSQL_BIN=$PWD/ogsql-artifact/ogsql" >> "$GITHUB_ENV"

      - name: Run Python unit tests
        run: python3 -m pytest tests/ -v --tb=short --ignore=tests/regress

      - name: Run Python regression tests
        run: python3 -m pytest tests/regress/ -v --tb=short

      - name: Run Python converter
        run: python3 converter/flux_gauss.py -c demo-project/fluxgauss_py.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Compile generated output
        run: cd dest_py && mvn compile --batch-mode --quiet
