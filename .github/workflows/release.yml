name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.5.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── ogsql binary (from ogsql-parser repo) ──────────────────────
  build-ogsql-linux-x86_64:
    name: Build ogsql linux-x86_64 (glibc >= 2.17)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ogsql-parser
        uses: actions/checkout@v4
        with:
          repository: c2j/ogsql-parser
          ref: main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: "0.13.0"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Build
        run: cargo zigbuild --release --features full --target x86_64-unknown-linux-gnu.2.17

      - name: Strip
        run: strip --strip-unneeded target/x86_64-unknown-linux-gnu/release/ogsql

      - name: Package
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar czf ${{ github.workspace }}/ogsql-linux-x86_64.tar.gz ogsql

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ogsql-linux-x86_64
          path: ogsql-linux-x86_64.tar.gz

  build-ogsql-linux-arm64:
    name: Build ogsql linux-arm64 (glibc >= 2.17)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ogsql-parser
        uses: actions/checkout@v4
        with:
          repository: c2j/ogsql-parser
          ref: main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: "0.13.0"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Build
        run: cargo zigbuild --release --features full --target aarch64-unknown-linux-gnu.2.17

      - name: Strip
        run: |
          sudo apt-get install -y binutils-aarch64-linux-gnu
          aarch64-linux-gnu-strip --strip-unneeded target/aarch64-unknown-linux-gnu/release/ogsql

      - name: Package
        run: |
          cd target/aarch64-unknown-linux-gnu/release
          tar czf ${{ github.workspace }}/ogsql-linux-arm64.tar.gz ogsql

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ogsql-linux-arm64
          path: ogsql-linux-arm64.tar.gz

  build-ogsql-windows-x86_64:
    name: Build ogsql windows-x86_64
    runs-on: windows-2022
    steps:
      - name: Checkout ogsql-parser
        uses: actions/checkout@v4
        with:
          repository: c2j/ogsql-parser
          ref: main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: x86_64-pc-windows-gnu-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: x86_64-pc-windows-gnu-cargo-

      - name: Build
        run: cargo build --release --features full --target x86_64-pc-windows-gnu
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Strip
        run: strip target/x86_64-pc-windows-gnu/release/ogsql.exe
        shell: bash

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "target/x86_64-pc-windows-gnu/release/ogsql.exe" `
            -DestinationPath "ogsql-windows-x86_64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ogsql-windows-x86_64
          path: ogsql-windows-x86_64.zip

  build-ogsql-macos-arm64:
    name: Build ogsql macos-arm64
    runs-on: macos-14
    steps:
      - name: Checkout ogsql-parser
        uses: actions/checkout@v4
        with:
          repository: c2j/ogsql-parser
          ref: main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --features full

      - name: Strip
        run: strip target/release/ogsql

      - name: Package
        run: |
          cd target/release
          tar czf ${{ github.workspace }}/ogsql-macos-arm64.tar.gz ogsql

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ogsql-macos-arm64
          path: ogsql-macos-arm64.tar.gz

  # ── fluxgauss binary (from this repo, uses ogsql-parser git dep) ─
  build-fluxgauss-linux-x86_64:
    name: Build fluxgauss linux-x86_64 (glibc >= 2.17)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout flux-gauss
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: "0.13.0"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Build
        run: cargo zigbuild --release --bin fluxgauss --target x86_64-unknown-linux-gnu.2.17

      - name: Strip
        run: strip --strip-unneeded target/x86_64-unknown-linux-gnu/release/fluxgauss

      - name: Package
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar czf ${{ github.workspace }}/fluxgauss-linux-x86_64.tar.gz fluxgauss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxgauss-linux-x86_64
          path: fluxgauss-linux-x86_64.tar.gz

  build-fluxgauss-linux-arm64:
    name: Build fluxgauss linux-arm64 (glibc >= 2.17)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout flux-gauss
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: "0.13.0"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Build
        run: cargo zigbuild --release --bin fluxgauss --target aarch64-unknown-linux-gnu.2.17

      - name: Strip
        run: |
          sudo apt-get install -y binutils-aarch64-linux-gnu
          aarch64-linux-gnu-strip --strip-unneeded target/aarch64-unknown-linux-gnu/release/fluxgauss

      - name: Package
        run: |
          cd target/aarch64-unknown-linux-gnu/release
          tar czf ${{ github.workspace }}/fluxgauss-linux-arm64.tar.gz fluxgauss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxgauss-linux-arm64
          path: fluxgauss-linux-arm64.tar.gz

  build-fluxgauss-windows-x86_64:
    name: Build fluxgauss windows-x86_64
    runs-on: windows-2022
    steps:
      - name: Checkout flux-gauss
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fluxgauss-x86_64-pc-windows-gnu-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: fluxgauss-x86_64-pc-windows-gnu-cargo-

      - name: Build
        run: cargo build --release --bin fluxgauss --target x86_64-pc-windows-gnu
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Strip
        run: strip target/x86_64-pc-windows-gnu/release/fluxgauss.exe
        shell: bash

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "target/x86_64-pc-windows-gnu/release/fluxgauss.exe" `
            -DestinationPath "fluxgauss-windows-x86_64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxgauss-windows-x86_64
          path: fluxgauss-windows-x86_64.zip

  build-fluxgauss-macos-arm64:
    name: Build fluxgauss macos-arm64
    runs-on: macos-14
    steps:
      - name: Checkout flux-gauss
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --bin fluxgauss

      - name: Strip
        run: strip target/release/fluxgauss

      - name: Package
        run: |
          cd target/release
          tar czf ${{ github.workspace }}/fluxgauss-macos-arm64.tar.gz fluxgauss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxgauss-macos-arm64
          path: fluxgauss-macos-arm64.tar.gz

  # ── Python engine CI ──────────────────────────────────────────
  test-python-engine:
    name: Python engine test (Linux x86_64)
    runs-on: ubuntu-22.04
    needs: [build-ogsql-linux-x86_64]
    steps:
      - name: Checkout flux-gauss
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Download ogsql binary
        uses: actions/download-artifact@v4
        with:
          name: ogsql-linux-x86_64
          path: ogsql-artifact

      - name: Extract and prepare ogsql
        run: |
          tar xzf ogsql-artifact/ogsql-linux-x86_64.tar.gz -C ogsql-artifact
          chmod +x ogsql-artifact/ogsql
          echo "OGSQL_BIN=$PWD/ogsql-artifact/ogsql" >> "$GITHUB_ENV"

      - name: Run Python converter
        run: python3 converter/flux_gauss.py -c demo-project/fluxgauss_py.yaml

      - name: Upload Python output
        uses: actions/upload-artifact@v4
        with:
          name: python-engine-output
          path: dest_py/

  # ── Rust engine CI ────────────────────────────────────────────
  test-rust-engine:
    name: Rust engine test (Linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout flux-gauss
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --bin fluxgauss

      - name: Run Rust converter
        run: cargo run --release --bin fluxgauss -- --config demo-project/fluxgauss_ru.yaml

      - name: Upload Rust output
        uses: actions/upload-artifact@v4
        with:
          name: rust-engine-output
          path: dest_ru/

  # ── Release ───────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs:
      - build-ogsql-linux-x86_64
      - build-ogsql-linux-arm64
      - build-ogsql-windows-x86_64
      - build-ogsql-macos-arm64
      - build-fluxgauss-linux-x86_64
      - build-fluxgauss-linux-arm64
      - build-fluxgauss-windows-x86_64
      - build-fluxgauss-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec sha256sum {} \; > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/SHA256SUMS.txt
