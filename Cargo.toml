[workspace]
members = ["crates/fluxgauss", "crates/fluxgauss-mcp"]
resolver = "2"

[workspace.package]
version = "0.6.27"
edition = "2021"

[workspace.dependencies]
ogsql-parser = { git = "https://github.com/c2j/ogsql-parser.git", tag = "v0.11.0" }
codeweb = { git = "https://github.com/c2j/codeweb.git", tag = "v0.9.11", default-features = false, features = ["analyze"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
