[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fluxgauss"
version = "0.6.24"
description = "PL/pgSQL → Spring Boot/MyBatis Java converter"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]
[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7.0"]

[project.scripts]
fluxgauss = "converter.flux_gauss:main"

[project.urls]
Repository = "https://github.com/c2j/flux-gauss"

[tool.setuptools]
packages = ["converter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "demo_migration: slow end-to-end demo yaml + mvn guard (~4 min, needs ogsql/Java/Maven)",
    "parity: cross-engine Python/Rust parity guard (needs ogsql + target/release/fluxgauss)",
    "baseline: ogagila/fastaas 回归基线配置语料守卫（fastaas 缺语料时 SKIP）",
]
